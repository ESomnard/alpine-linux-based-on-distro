# Plume — projets de développement (plume-dev). Une ligne par projet :
#   identifiant | nom affiché | dépôt git | commande pour le lancer (dans le dossier du projet)
# Les projets sont clonés dans ~/Projets/<identifiant>. Pour ajouter les tiens sans toucher à ce
# fichier : ~/.config/plume/projets.conf (même format ; une ligne au même identifiant remplace celle-ci).
plume-gps   | Plume GPS (Flutter, Android)        | git@github.com:ESomnard/plume-navigation.git          | flutter pub get && flutter run
hud         | HUD Lockscreen (Electron)           | git@github.com:ESomnard/HUD-Lockscreen.git            | npm install && npm start -- --ozone-platform-hint=auto
alpine      | Plume Linux (la distribution)       | git@github.com:ESomnard/alpine-linux-based-on-distro.git | ls out/plume-void-*.iso >/dev/null 2>&1 || make iso-void; make run-void
launcher    | Plume Launcher (Android, Kotlin)    | git@github.com:ESomnard/plume-launcher.git            | ./gradlew assembleDebug && adb install -r app/build/outputs/apk/debug/app-debug.apk
manager     | Plume Manager (Node, Claude)        | git@github.com:ESomnard/plume-manager.git             | npm install && ./start.sh
fenuasmash  | FenuaSmash (Docker : API, web)      | git@github.com:melfrom987/fenuasmash.git              | make env; make stack
