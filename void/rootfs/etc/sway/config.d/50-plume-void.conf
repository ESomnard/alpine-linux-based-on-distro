# Plume Void — compléments de session (lu par ~/.config/sway/config : include /etc/sway/config.d/*)

# portails (partage d'écran, fenêtres « Ouvrir un fichier » des applis Flatpak)
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland SWAYSOCK

# touche Windows seule (appuyée puis relâchée) : toutes les applications installées, comme sous
# Windows ; la rappuyer referme. Super + une autre touche garde son raccourci (sway ne déclenche
# un --release que si aucune autre touche n'a été tapée entre-temps).
bindsym --release Super_L exec plume-menu
bindsym --release Super_R exec plume-menu

# Éteindre · Redémarrer · Veille · Déconnexion · Verrouiller : écran Plume (plus la barre orange)
bindsym --no-warn $mod+Shift+e exec plume-alimentation

# Paramètres : fenêtre libre, centrée
for_window [app_id="plume-parametres"] floating enable, resize set 960 660, move position center

# pavé numérique activé dès l'ouverture de la session
input type:keyboard xkb_numlock enabled

# notifications : 100 gardées en mémoire (clic sur l'heure dans la barre), avertissement d'ibus caché
exec plume-notifications --preparer

# fichiers du dossier Bureau sur le bureau (ouvrir, sélectionner en glissant, renommer, corbeille)
exec plume-icones-bureau

# clés USB et disques externes : montés tout seuls, avec une notification
exec udiskie --automount --notify --no-tray --file-manager pcmanfm

# fenêtres comme sous Windows : Alt + F4 ferme, Super + flèche gauche/droite
# déjà pris par le focus, donc Super + Ctrl + flèches = moitié d'écran (côte à côte)
bindsym Mod1+F4 kill
bindsym $mod+Ctrl+Left  layout splith, move left
bindsym $mod+Ctrl+Right layout splith, move right
bindsym $mod+Ctrl+Up    fullscreen toggle
bindsym $mod+Ctrl+Down  floating toggle
# clic du milieu sur le bord d'une fenêtre = fermer
bindsym --border button2 kill
# tous les raccourcis en boutons (en texte dans un terminal : plume-linux help)
bindsym $mod+F1 exec plume-raccourcis
for_window [title="^Raccourcis Plume$"] floating enable

# lumière du soir (Super + n) : reprend le dernier choix
exec plume-nuit --demarrage
bindsym $mod+n exec plume-nuit

# veille (Paramètres › Veille) : verrouillage et extinction de l'écran, délai choisi gardé
exec plume-veille --demarrage

# accessibilité : loupe, lecteur d'écran, clavier à l'écran (+ choix gardés)
exec plume-accessibilite --demarrage
bindsym $mod+Mod1+z exec plume-accessibilite loupe
bindsym $mod+Mod1+s exec plume-accessibilite lecteur
bindsym $mod+Mod1+k exec plume-accessibilite clavier

# sauvegarde automatique quand le disque de sauvegarde est branché (une fois par jour)
exec plume-sauvegarde --auto

# wifi d'hôtel / de gare : ouvre la page de connexion toute seule
exec plume-portail --surveiller

# session live : comment installer
exec sh -c '[ -f /etc/default/live.conf ] && sleep 10 && notify-send -a Plume "Bienvenue sur Plume" "Pour l’installer sur ce PC : « Installer Plume » dans la grille des applications (Super + a)."'

# premier démarrage (PC installé) : assistant Internet, heure, Flathub, mises à jour, packs
exec plume-bienvenue --demarrage
for_window [title="^Bienvenue sur Plume$"] floating enable
for_window [title="^Signaler un problème$" app_id="^yad$"] floating enable

# réglages des écrans enregistrés par plume-ecrans
include ~/.config/sway/ecrans.conf
