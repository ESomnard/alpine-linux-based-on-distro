# Plume Void — compléments de session (lu par ~/.config/sway/config : include /etc/sway/config.d/*)

# portails (partage d'écran, fenêtres « Ouvrir un fichier » des applis Flatpak)
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland SWAYSOCK

# clés USB et disques externes : montés tout seuls, avec une notification
exec udiskie --automount --notify --no-tray --file-manager pcmanfm

# lumière du soir (Super + n) : reprend le dernier choix
exec plume-nuit --demarrage
bindsym $mod+n exec plume-nuit

# wifi d'hôtel / de gare : ouvre la page de connexion toute seule
exec plume-portail --surveiller

# session live : comment installer
exec sh -c '[ -f /etc/default/live.conf ] && sleep 10 && notify-send -a Plume "Bienvenue sur Plume" "Pour l’installer sur ce PC : « Installer Plume » dans la grille des applications (Super + a)."'

# réglages des écrans enregistrés par plume-ecrans
include ~/.config/sway/ecrans.conf
