# Plume — thème d'icônes Papirus : seulement les icônes d'applis en 64 px (dock, bureau, Paramètres).
# Le paquet complet fait 103 000 fichiers (toutes tailles, variantes sombre et claire) ; on en garde 8 000.
noextract=/usr/share/icons/*Papirus*
noextract=!/usr/share/icons/Papirus/64x64/apps/*
noextract=!/usr/share/icons/Papirus/index.theme
