# Plume — applications du dock (plume-shell)
# Copie ce fichier dans ~/.config/plume/dock.conf pour le personnaliser.
#
# Format :  glyphe | nom affiché | commande | app_id
#   - app_id sert à savoir si l'appli est ouverte (point lumineux) et à l'afficher au clic
#     (pour le trouver : swaymsg -t get_tree | grep app_id)
#   - « --- » ajoute un séparateur ; « @power » dessine le bouton d'alimentation
#   - clic gauche : affiche l'appli si elle est ouverte, sinon la lance ; clic milieu : nouvelle fenêtre

>_ | Terminal | foot | foot
◎ | Firefox | firefox | firefox
▤ | Fichiers | pcmanfm | pcmanfm
✎ | Éditeur | foot -a micro micro | micro
▶ | Vidéo et musique | mpv --player-operation-mode=pseudo-gui | mpv
◧ | PDF | zathura | org.pwmt.zathura
◈ | Système | foot -a plume-info sh -c 'fastfetch; exec sh' | plume-info
---
@power | Éteindre / redémarrer | swaynag -t warning -m 'Que faire ?' -B 'Éteindre' 'doas /sbin/poweroff' -B 'Redémarrer' 'doas /sbin/reboot' -B 'Veille' 'doas /usr/sbin/zzz' -B 'Déconnexion' 'swaymsg exit' |
