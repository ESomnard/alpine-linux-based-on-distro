# Plume — réponses pour l'installation 100 % automatique.
# Copie ce fichier, remplis-le, puis depuis l'ISO live :
#     sh /etc/plume/install.sh --auto /chemin/vers/ton-fichier.conf
# ATTENTION : le disque choisi est entièrement EFFACÉ, sans confirmation.

DISQUE="/dev/sda"              # disque cible (lsblk pour le trouver : sda, nvme0n1, vda…)
UTILISATEUR="moi"              # ton identifiant (minuscules, sans espace)
MOT_DE_PASSE="change-moi"      # ton mot de passe (aussi celui de sudo)
MOT_DE_PASSE_ROOT=""           # vide = compte root verrouillé (on passe par sudo)

CLAVIER="fr fr"                # disposition : « fr fr », « us us », « ch fr »…
FUSEAU="Europe/Paris"
MACHINE="plume"                # nom de la machine sur le réseau

RESEAU="eth0"                  # câble : interface réseau (ip link pour la voir)
WIFI_NOM=""                    # wifi : nom du réseau (laisser vide pour le câble)
WIFI_MOT_DE_PASSE=""

BUREAU="oui"                   # installer le bureau tout seul au premier démarrage
APPLIS="oui"                   # avec Firefox, mpv… (« non » = plus léger)
REDEMARRER="oui"               # redémarrer à la fin

CHIFFREMENT="non"              # « oui » : disque chiffré (LUKS2), protège tes fichiers si le PC est volé
PHRASE_CHIFFREMENT=""          # demandée à chaque démarrage (8 caractères minimum ; évite les
                               # caractères absents du clavier choisi). Oubliée = données perdues.
